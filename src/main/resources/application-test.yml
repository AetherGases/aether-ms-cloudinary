spring:
  application:
    name: core-api-test

  config:
    import: optional:file:.env[.properties]

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

security:
  internal-authentication-key: test-internal-authentication-key
  jwt:
    secret-key: test-jwt-secret

server:
  port: 0

brevo:
  enabled: false
  api:
    key: test-brevo-key
    url: https://api.brevo.com/v3/smtp/email

  sender:
    email: test@test.com
    name: Test

cloudinary:
  cloud_name: test-cloud
  api_key: test-api-key
  api_secret: test-api-secret